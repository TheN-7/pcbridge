name: Build and release PC Bridge APK

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to
# trigger this. It builds a signed release APK on a real Linux runner
# and attaches it to a GitHub Release named after the tag -- no local
# Android Studio/signing setup needed to publish a build to your phone.
#
# Mirrors the PC side's build-release.yml: same tag convention, same
# "bake the update repo/token in at build time" approach (here via
# Gradle -P/env vars -> BuildConfig fields, see app/build.gradle),
# same "attach the release asset, then a separate GitHub Actions repo
# secret carries the signing material" pattern.
#
# Requires four repository secrets (Settings -> Secrets and variables
# -> Actions -> New repository secret) -- see README.md's "Signing &
# CI" section for how to generate these:
#   ANDROID_KEYSTORE_BASE64   -- base64 of keystore/pcbridge-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optionally also UPDATE_TOKEN (a fine-grained PAT scoped to *this* repo,
# Contents: Read-only) if/when the app gains in-app update checking --
# harmless to add now even before that exists.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Derive version name/code from the tag
        id: version
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        # versionName comes straight from the tag (e.g. "1.0.0"); Android
        # also requires a strictly-increasing integer versionCode for an
        # install to be recognized as an update rather than a downgrade
        # -- github.run_number (this workflow's own run counter) already
        # only ever goes up, so it's a simple, reliable source for that.

      - name: Recreate the release keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/pcbridge-release.jks
          cat > keystore.properties << EOF
          storeFile=keystore/pcbridge-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
        # Exact same file/paths app/build.gradle already looks for
        # locally (see keystore.properties.example) -- CI just recreates
        # it fresh each run from secrets instead of it living on disk.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          UPDATE_REPO: ${{ github.repository }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Rename APK for the release
        run: cp app/build/outputs/apk/release/app-release.apk PCBridge.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PCBridge.apk
          generate_release_notes: true

      - name: Clean up signing material
        if: always()
        run: rm -rf keystore keystore.properties
