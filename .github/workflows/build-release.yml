# Builds pcbridge on GitHub's runners, for Windows and for Linux.
#
# This exists because the local toolchain is deliberately not permanent --
# see TOOLCHAIN.md, which documents installing Rust, portable Node and the
# MSVC Build Tools and then removing them again. The runners already have
# MSVC and the WebView2 runtime, so a release can be cut without any of that
# coming back onto a developer machine.
#
# Linux was previously left out here on the grounds that the app links
# webview2-com and the windows-* crates. That was wrong: those are Tauri's
# own platform-conditional dependencies, which is why they turn up in a
# Windows binary. Nothing in this crate's Cargo.toml is Windows-specific
# and there is no cfg(windows) code -- the only platform-sensitive lines
# are a USERPROFILE lookup that falls back to HOME, and some verbatim-path
# trimming that is inert off Windows. On Linux, Tauri uses WebKitGTK
# instead, and `"targets": "all"` produces .deb, .rpm and AppImage.
#
#   push to main / PR   build + typecheck, artifacts kept for 14 days
#   push a v* tag       the same build, published to a GitHub Release
#   manual dispatch     build on demand from any branch
#
# Nothing is code signed, so Windows SmartScreen will warn on first run
# exactly as it does for a local build. Signing needs a certificate in
# repository secrets; see the note at the bottom of this file.

name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# tauri-action creates the Release and uploads the installers to it, which
# needs write access to repository contents. Everything else is read-only.
permissions:
  contents: write

# A second push to the same branch makes the first build irrelevant. Tag
# builds are excluded: those publish a Release, so cancelling one halfway
# could leave a release with only some of its assets attached.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      # One platform failing must not cancel the other. A tag build that
      # loses Linux should still publish the Windows installer rather than
      # producing no release at all.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
          # 22.04 rather than latest, deliberately. The glibc a binary is
          # built against is the oldest it will run on, and 24.04's is too
          # new for a lot of still-supported distributions.
          - platform: ubuntu-22.04
            label: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri renders through WebKitGTK on Linux, none of which is on the
      # runner by default. libxdo covers the tray, librsvg the icons, and
      # patchelf is what the AppImage bundler uses to rewrite rpaths.
      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      # Pinned to the major version documented in TOOLCHAIN.md. Left as 24
      # rather than 24.19.0 so security patches are picked up: the frontend
      # build is not sensitive to the patch level, and pinning exactly means
      # a yanked patch release breaks CI with no warning.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # A tag and the version in tauri.conf.json have to agree, or the
      # release says one thing and the installer inside it says another.
      # Runs before the compiler so a mismatch costs seconds rather than
      # a full build, and only on tag pushes -- branches are free to sit
      # at whatever version they like until they're released.
      - name: Check the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          declared=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $declared."
            echo "::error::Bump package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json to $tag, or tag v$declared instead."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches the declared version $declared."

      # Rust is pinned exactly, unlike Node. The compiler version affects the
      # binary that ships, so matching the version TOOLCHAIN.md records keeps
      # CI builds and local builds comparable. Bump both together.
      - name: Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      # Without this every run recompiles all 105 crates from scratch, which
      # is roughly a 15-minute build reduced to about 3 on a cache hit.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json specifies and fails if the two have drifted, which
      # is what makes the frontend half of the build reproducible.
      - name: Install dependencies
        run: npm ci

      # svelte-check runs before the Rust build because it takes seconds and
      # the Rust build takes minutes -- a type error should not cost a full
      # compile before it surfaces.
      - name: Typecheck
        run: npm run check

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tauri-action publishes a Release only when tagName is set, so
          # these are empty for branch and PR builds -- the same build runs,
          # it just stops short of publishing.
          #
          # The pushed tag itself, not tauri-action's __VERSION__. That
          # placeholder expands to the version in tauri.conf.json, and the
          # two drifted: every tag so far was cut from a commit whose
          # config still said 0.1.0, so pushing v4.3.0 published a release
          # against a v0.1.0 tag nobody had ever pushed -- which is why it
          # appeared nowhere anyone thought to look. The check above now
          # stops the two disagreeing in the first place.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('pcbridge {0}', github.ref_name) || '' }}
          # Published outright, not held as a draft. A draft is the safer
          # default -- it lets you check the installer before anyone can
          # download it -- but it only appears to people with write access
          # and needs a manual Publish, which reads as "the release never
          # happened". Pushing a tag is already a deliberate act; this
          # makes it do the whole job. Delete the release if a build turns
          # out bad.
          releaseDraft: false
          prerelease: false

      # Attached to every run, tags included. Tag builds used to skip this
      # on the grounds that the Release already had the installers -- which
      # left nothing to download at all on any run where publishing went
      # wrong, exactly when you most want the file. Uploading twice costs
      # a few seconds and means the build always hands back what it built.
      #
      # Every platform's paths are listed and each job matches only its
      # own; `if-no-files-found: error` still fires if a job produced
      # nothing at all, which is the case worth failing on. The name is
      # per-platform because upload-artifact v4 rejects duplicates.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pcbridge-installers-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

# What comes out, per platform:
#
#   windows   an NSIS .exe installer and an .msi
#   linux     a .deb, an .rpm and an AppImage
#
# Where it ends up:
#
#   any run     Actions -> the run -> Artifacts ->
#               pcbridge-installers-windows / -linux, kept 14 days
#   tag runs    the same, plus a Release named after the tag, carrying
#               every platform's files -- both jobs attach to the one
#               release, whichever finishes first creating it
#
# Releases are drafts on purpose, so a tag push never puts anything in
# front of users by itself -- check the installer, then hit Publish.
#
# To cut one, first make the version agree in all three files, or the
# check above stops the build and tells you so:
#
#     package.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json
#
# then tag it with a matching v-prefixed tag:
#
#     git tag v4.4.0
#     git push origin v4.4.0
#
# Code signing, when you want to stop SmartScreen warning people: add the
# certificate as a base64 secret and set TAURI_WINDOWS_SIGNTOOL_PATH plus
# the certificate thumbprint in the bundle.windows config. An OV certificate
# quiets the warning only after enough downloads build reputation; an EV one
# quiets it immediately, which is most of why it costs what it does.
