[package]
name = "pcbridge"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pcbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time", "signal"] }
tower-http = { version = "0.7.0", features = ["fs", "cors", "set-header"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23.43", features = ["ring"] }
rcgen = "0.14.8"
sha2 = "0.11.0"
anyhow = "1.0.104"
thiserror = "2.0.20"
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.33"
rand = "0.10.2"
mime_guess = "2.0.5"
local-ip-address = "0.6.13"
hostname = "0.4.2"
walkdir = "2.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

